<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T-580 Web Clone</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="timer-body">

    <div id="startStop" class="big-button"></div>

    <div class="control-panel">

        <button id="hourBtn" class="round-btn">
            HOUR
        </button>

        <button id="minBtn" class="round-btn">
            MIN
        </button>

        <button id="secBtn" class="round-btn">
            SEC
        </button>

        <div id="led" class="led"></div>

    </div>

    <div class="display-wrap">

        <div id="display" class="display">
            00:00:00
        </div>

    </div>

    <div class="logo">
        learning timer
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
